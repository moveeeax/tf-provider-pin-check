name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: tf-provider-pin-check
    steps:
      - uses: actions/checkout@v4

      # setup-go pulls the official .tar.gz (not .tar.xz), so it works on the
      # minimal self-hosted runner. The version comes straight from go.mod.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -count=1

      # Smoke-test the built binary the way a user runs it: the good fixtures
      # must exit 0, the bad fixtures must exit 1 with findings.
      - name: CLI smoke test
        run: |
          set -eux
          go build -ldflags "-X main.version=ci" -o tfpin .
          ./tfpin ./examples/good
          if ./tfpin ./examples/bad; then
            echo "expected examples/bad to fail, but it passed" >&2
            exit 1
          fi
